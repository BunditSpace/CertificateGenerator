<div class="min-h-screen bg-slate-50">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Bulk Certificate & Payslip Generator</h1>
        <p class="text-xs text-slate-500">
          ออกแบบเทมเพลต PDF, แสดงตัวอย่างแบบ Real-time และสร้างเอกสารจากไฟล์ Excel แบบกลุ่ม
        </p>
      </div>
      <span class="rounded-full bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-700 border border-indigo-200">
        .NET 8 + QuestPDF + Angular
      </span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <app-template-designer
      [config]="templateConfig"
      (configChange)="onConfigChange($event)"
    />

    <app-job-progress [config]="templateConfig" />
  </main>
</div>
